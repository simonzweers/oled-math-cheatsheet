name: Build PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  PDF_NAME: oled-math-cheatsheet

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_shell_escape: true
          extra_system_packages: "inkscape py3-pygments"

      - name: Rename PDF with compile date
        run: |
          date_str="$(date +%d-%m-%Y)"
          pdf_file="${PDF_NAME}-${date_str}.pdf"
          echo "PDF_FILE=${pdf_file}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${date_str}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          mv main.pdf "${pdf_file}"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PDF_FILE }}
          path: ${{ env.PDF_FILE }}

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PDF_FILE }}
          files: ${{ env.PDF_FILE }}
